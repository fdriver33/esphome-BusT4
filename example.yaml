esphome:
  name: gate-toona
  friendly_name: gate-toona

# Replace this with your actual platform if you aren't using ESP32.

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  # level: VERBOSE
  
  

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80
  # v3 layout avoids table/log overlap seen with v2 in some browsers; set log: false to hide the panel
  version: 3

  
external_components:
  - source:
      type: git
      url: https://github.com/fdriver33/esphome-BusT4
      ref: config-switch-readback
    components: [bus_t4]
    refresh: Always

uart:
  tx_pin: GPIO21
  rx_pin: GPIO18
  baud_rate: 19200

bus_t4:
  id: bus

cover:
  - platform: bus_t4
    name: "Gate"
    id: gate
    auto_learn_timing: true
    open_duration: 20s
    close_duration: 20s
    position_report_interval: 1s

# Optional: Additional buttons for partial opening
button:
  - platform: template
    name: "Partial Open 1"
    icon: "mdi:gate-arrow-right"
    on_press:
      - lambda: id(gate).send_cmd(CMD_OPEN_PARTIAL_1);

  - platform: template
    name: "Partial Open 2"
    icon: "mdi:gate-arrow-right"
    on_press:
      - lambda: id(gate).send_cmd(CMD_OPEN_PARTIAL_2);

  - platform: template
    name: "Step-by-Step"
    icon: "mdi:gate"
    on_press:
      - lambda: id(gate).send_cmd(CMD_STEP);

  - platform: template
    name: "Lock"
    icon: "mdi:lock"
    on_press:
      - lambda: 'id(gate).send_cmd(CMD_BLOCK, IT4WIFI);'

  - platform: template
    name: "Unlock"
    icon: "mdi:lock-open"
    on_press:
      - lambda: 'id(gate).send_cmd(CMD_RELEASE, IT4WIFI);'

# MC824H level 1 functions with controller state readback.
# L5 (electric lock / courtesy light), L7 and L8 are not exposed here.
# The controller rejects the component's Peak register (0x93), so it is omitted.
switch:
  - platform: bus_t4
    name: "L1 Auto-Close"
    icon: "mdi:timer"
    bus_t4_id: bus
    cover_id: gate
    setting: auto_close

  - platform: bus_t4
    name: "L2 Close after Photo"
    icon: "mdi:camera-timer"
    bus_t4_id: bus
    cover_id: gate
    setting: photo_close

  - platform: bus_t4
    name: "L3 Always Close"
    icon: "mdi:lock"
    bus_t4_id: bus
    cover_id: gate
    setting: always_close

  - platform: bus_t4
    name: "L4 Standby"
    icon: "mdi:power-standby"
    bus_t4_id: bus
    cover_id: gate
    setting: standby

  - platform: bus_t4
    name: "L6 Pre-Flash"
    icon: "mdi:alarm-light"
    bus_t4_id: bus
    cover_id: gate
    setting: pre_flash

# Security lock using IT4WIFI device identity
lock:
  - platform: template
    name: "Gate Lock"
    optimistic: true
    on_lock:
      - lambda: 'id(gate).send_cmd(CMD_BLOCK, IT4WIFI);'
    on_unlock:
      - lambda: 'id(gate).send_cmd(CMD_RELEASE, IT4WIFI);'

# Raw hex command input for debugging/testing
# Enter hex string like "55.0C.00.FF..." or "550C00FF..." in Home Assistant
number:
  - platform: bus_t4
    name: "Opening Speed"
    icon: "mdi:speedometer"
    unit_of_measurement: "%"
    mode: slider
    bus_t4_id: bus
    cover_id: gate
    setting: opening_speed

  - platform: bus_t4
    name: "Closing Speed"
    icon: "mdi:speedometer"
    unit_of_measurement: "%"
    mode: slider
    bus_t4_id: bus
    cover_id: gate
    setting: closing_speed

  - platform: bus_t4
    name: "Auto-Close Pause Time"
    icon: "mdi:timer-outline"
    unit_of_measurement: "s"
    mode: box
    bus_t4_id: bus
    cover_id: gate
    setting: pause_time

  - platform: bus_t4
    name: "Photo-Close Time"
    icon: "mdi:camera-timer"
    unit_of_measurement: "s"
    mode: box
    bus_t4_id: bus
    cover_id: gate
    setting: photo_close_time

  - platform: bus_t4
    name: "Always-Close Time"
    icon: "mdi:timer-lock"
    unit_of_measurement: "s"
    mode: box
    bus_t4_id: bus
    cover_id: gate
    setting: always_close_time
    
text:
  - platform: template
    name: "Raw Command"
    id: raw_command
    optimistic: true
    mode: text
    on_value:
      then:
        - lambda: |-
            if (!x.empty()) {
              id(gate).send_raw_cmd(x);
            }
